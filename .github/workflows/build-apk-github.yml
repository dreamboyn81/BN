name: build-apk

# 仅手动触发。打出 APK 后自行签名。
# 包名由 android/app/build.gradle 的 applicationId 决定（请改成 com.andromeda.androbench2）。

on:
  workflow_dispatch:
    inputs:
      games:
        description: '游戏列表（逗号分隔 title ID，留空=全部）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$ANDROID_SDK_ROOT/emulator" "$ANDROID_SDK_ROOT/system-images" || true
          df -h /

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: .NET 10 (NativeAOT translator)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Gradle (cached, with the wrapper's version)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Install SDK packages
        run: |
          SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" \
                  "ndk;28.2.13676358" "cmake;3.22.1"
          echo "--- ndk ---"; ls "$ANDROID_SDK_ROOT/ndk"
          echo "--- cmake ---"; ls "$ANDROID_SDK_ROOT/cmake"

      - name: Build deps, shasum shim, Linux port of build.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build cmake git curl zlib1g-dev
          sudo tee /usr/local/bin/shasum > /dev/null <<'SHIM'
          #!/bin/sh
          [ "$1" = "-a" ] && [ "$2" = "256" ] && shift 2
          exec sha256sum "$@"
          SHIM
          sudo chmod +x /usr/local/bin/shasum
          sed -i 's|\$NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-strip|\$BIN/llvm-strip|' \
            android/ondevice/build.sh
          grep -n llvm-strip android/ondevice/build.sh

      - name: Packer stage (CPython, capstone, lz4, translator, SPIRV-Tools)
        run: zsh android/ondevice/build.sh "$RUNNER_TEMP/packer"

      - name: APK (unsigned / debug-signed; you re-sign offline)
        run: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/app/local.properties
          cd android/app
          chmod +x gradlew

          EXTRA=()
          GAMES="${{ github.event.inputs.games }}"
          if [ -n "$GAMES" ]; then
            EXTRA+=(-PnxGames="$GAMES")
            echo "Games: $GAMES"
          else
            echo "Games: all (from gradle.properties)"
          fi

          # 不使用 -PnxLive，避免强制正式签名；包名请在 build.gradle 里改成 com.andromeda.androbench2
          ./gradlew --no-daemon \
            -PnxPackStage="$RUNNER_TEMP/packer/stage" \
            "${EXTRA[@]}" \
            apk

          ls -la out/
          echo "----"
          echo "APK is debug-signed. Re-sign offline with your own key, e.g.:"
          echo "  apksigner sign --ks your.keystore --out banana-signed.apk out/*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: banana-native-apk
          path: android/app/out/*.apk
          if-no-files-found: error
