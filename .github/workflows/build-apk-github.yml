name: build-apk

# Builds the Android APK and uploads it as a workflow artifact.
# No game code or game data is in the repo or the APK.
#
# -PnxLive=true requires a release keystore (NX_SIGN_*). For CI without
# secrets, use mode=test / mkw, or mode=live-debug (self-signed temp key).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: 'test'
        type: choice
        options:
          - test        # default test package: dev.nxnative.android (no signing)
          - mkw         # Mario Kart World only test package
          - live-debug  # nxLive behaviour + package name, self-signed temp key
          - live        # real release: needs repo secrets NX_SIGN_STORE/ALIAS/PASS
  push:
    branches: [ android, main, master ]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$ANDROID_SDK_ROOT/emulator" "$ANDROID_SDK_ROOT/system-images" || true
          df -h /

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: .NET 10 (NativeAOT translator)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Gradle (cached, with the wrapper's version)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Install SDK packages
        run: |
          SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" \
                  "ndk;28.2.13676358" "cmake;3.22.1"
          echo "--- ndk ---"; ls "$ANDROID_SDK_ROOT/ndk"
          echo "--- cmake ---"; ls "$ANDROID_SDK_ROOT/cmake"

      - name: Build deps, shasum shim, Linux port of build.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build cmake git curl zlib1g-dev
          sudo tee /usr/local/bin/shasum > /dev/null <<'SHIM'
          #!/bin/sh
          [ "$1" = "-a" ] && [ "$2" = "256" ] && shift 2
          exec sha256sum "$@"
          SHIM
          sudo chmod +x /usr/local/bin/shasum
          sed -i 's|\$NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-strip|\$BIN/llvm-strip|' \
            android/ondevice/build.sh
          grep -n llvm-strip android/ondevice/build.sh

      - name: Packer stage (CPython, capstone, lz4, translator, SPIRV-Tools)
        run: zsh android/ondevice/build.sh "$RUNNER_TEMP/packer"

      - name: APK
        env:
          # Optional real release secrets (Settings → Secrets and variables → Actions)
          NX_SIGN_STORE: ${{ secrets.NX_SIGN_STORE }}
          NX_SIGN_ALIAS: ${{ secrets.NX_SIGN_ALIAS }}
          NX_SIGN_PASS: ${{ secrets.NX_SIGN_PASS }}
        run: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/app/local.properties
          cd android/app
          chmod +x gradlew

          MODE="${{ github.event.inputs.mode || 'test' }}"
          echo "Build mode: $MODE"

          case "$MODE" in
            test)
              ./gradlew --no-daemon \
                -PnxPackStage="$RUNNER_TEMP/packer/stage" \
                apk
              ;;
            mkw)
              ./gradlew --no-daemon \
                -PnxPackStage="$RUNNER_TEMP/packer/stage" \
                -PnxGames=0400C3F00006E000 \
                -PnxApp=mkw \
                apk
              ;;
            live-debug)
              # Self-signed key so -PnxLive=true works without your real keystore
              KEYSTORE="$RUNNER_TEMP/debug-release.jks"
              keytool -genkeypair -v \
                -keystore "$KEYSTORE" \
                -storepass android \
                -keypass android \
                -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=BananaNative CI, O=CI, C=US"
              export NX_SIGN_STORE="$KEYSTORE"
              export NX_SIGN_ALIAS=androiddebugkey
              export NX_SIGN_PASS=android
              ./gradlew --no-daemon \
                -PnxPackStage="$RUNNER_TEMP/packer/stage" \
                -PnxLive=true \
                apk
              ;;
            live)
              if [ -z "$NX_SIGN_STORE" ] || [ -z "$NX_SIGN_ALIAS" ] || [ -z "$NX_SIGN_PASS" ]; then
                echo "mode=live needs repo secrets: NX_SIGN_STORE, NX_SIGN_ALIAS, NX_SIGN_PASS"
                echo "Use mode=test, mkw, or live-debug instead."
                exit 1
              fi
              # If the secret is base64 of the keystore file, decode it
              if [ ! -f "$NX_SIGN_STORE" ]; then
                echo "$NX_SIGN_STORE" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null || true
                if [ -s "$RUNNER_TEMP/release.jks" ]; then
                  export NX_SIGN_STORE="$RUNNER_TEMP/release.jks"
                fi
              fi
              ./gradlew --no-daemon \
                -PnxPackStage="$RUNNER_TEMP/packer/stage" \
                -PnxLive=true \
                apk
              ;;
            *)
              echo "Unknown mode: $MODE"
              exit 1
              ;;
          esac

          ls -la out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: banana-native-apk
          path: android/app/out/*.apk
          if-no-files-found: error
